<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#121216" />
  <meta name="description" content="Syndicate Idle: Capo's Rise — A stylized pixel-art Mafia crime empire idle RPG with 5 noir city districts, Federal Reserve Heist raids, Fight Club wagers, and Crime Family Turf Wars." />
  <title>Syndicate Idle: Capo's Rise</title>
  <link rel="icon" href="./favicon.ico" />
  <script>
    (function () {
      var shown = false;
      function showBootDiagnostic(title, detail) {
        if (shown) return;
        if (detail && /WebSocket|vite-hmr/i.test(String(detail))) return;
        shown = true;
        function render() {
          if (!document.body) return;
          if (document.getElementById('syndicate-boot-error')) return;
          var wrap = document.createElement('div');
          wrap.id = 'syndicate-boot-error';
          wrap.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#121216;color:#f4f4f5;font-family:system-ui,-apple-system,sans-serif;padding:16px;';
          var card = document.createElement('div');
          card.style.cssText = 'width:100%;max-width:400px;background:#1a1920;border:1px solid #8B1E24;border-radius:12px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.8);';
          var ey = document.createElement('div');
          ey.style.cssText = 'font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#f59e0b;margin-bottom:4px;';
          ey.textContent = "Syndicate Idle · Boot Diagnostic";
          var h = document.createElement('h2');
          h.style.cssText = 'font-size:16px;font-weight:800;margin:0 0 8px 0;color:#fff;';
          h.textContent = title || 'Unable to Start Game';
          var pre = document.createElement('pre');
          pre.style.cssText = 'margin:0 0 14px 0;padding:10px;background:#121216;border:1px solid #27272a;border-radius:8px;font-size:11px;line-height:1.4;color:#fda4af;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto;';
          pre.textContent = String(detail || 'Unknown error');
          var row = document.createElement('div');
          row.style.cssText = 'display:flex;gap:8px;';
          var b1 = document.createElement('button');
          b1.type = 'button';
          b1.textContent = 'Reload';
          b1.style.cssText = 'flex:1;padding:8px 12px;border:none;border-radius:8px;background:#f59e0b;color:#09090b;font-weight:800;font-size:12px;cursor:pointer;';
          b1.onclick = function () { window.location.reload(); };
          var b2 = document.createElement('button');
          b2.type = 'button';
          b2.textContent = 'Reset Save & Reload';
          b2.style.cssText = 'flex:1;padding:8px 12px;border:1px solid #8B1E24;border-radius:8px;background:rgba(139,30,36,.3);color:#fecdd3;font-weight:700;font-size:12px;cursor:pointer;';
          b2.onclick = function () {
            try { window.localStorage && window.localStorage.clear(); } catch (e) {}
            window.location.reload();
          };
          row.appendChild(b1);
          row.appendChild(b2);
          card.appendChild(ey);
          card.appendChild(h);
          card.appendChild(pre);
          card.appendChild(row);
          wrap.appendChild(card);
          document.body.appendChild(wrap);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', render, { once: true });
        } else {
          render();
        }
      }
      window.onerror = function (msg, src, line, col, err) {
        var info = (err && err.stack) ? err.stack : (String(msg) + (src ? ' (' + src + ':' + line + ':' + col + ')' : ''));
        showBootDiagnostic('Runtime Error Detected', info);
        return false;
      };
      window.onunhandledrejection = function (ev) {
        var r = ev && ev.reason;
        showBootDiagnostic('Unhandled Promise Rejection', r && r.stack ? r.stack : String(r || 'Promise rejected'));
      };
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #app-root {
      height: 100%;
      height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      background-color: #0c0b0e;
      color: #f4f4f5;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    button, [role="button"] { touch-action: manipulation; font-family: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    input, textarea, select {
      user-select: text;
      -webkit-user-select: text;
      font-family: inherit;
      font-size: 16px !important;
      color: #f4f4f5;
    }
    .pixelated { image-rendering: pixelated; image-rendering: crisp-edges; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
    #app-root {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 18% 35%, rgba(139, 30, 36, 0.18), transparent 44%),
        radial-gradient(circle at 82% 65%, rgba(245, 158, 11, 0.09), transparent 42%),
        #0c0b0e;
    }
    #phone-shell {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 450px;
      height: 100%;
      background: #121216;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.92);
      border-left: 1px solid #27272a;
      border-right: 1px solid #27272a;
    }
    @media (max-width: 455px) {
      #phone-shell { border-left: none; border-right: none; }
    }
    #stage-wrap {
      position: relative;
      height: 42%;
      width: 100%;
      flex-shrink: 0;
      overflow: hidden;
      background: #121216;
      border-bottom: 2px solid #27272a;
    }
    #game-canvas { display: block; width: 100%; height: 100%; }
    #top-hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px 8px;
      z-index: 10;
    }
    .hud-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; pointer-events: auto; }
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(18, 18, 22, 0.88);
      border: 1px solid rgba(63, 63, 70, 0.9);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.1;
      color: #f4f4f5;
      backdrop-filter: blur(4px);
    }
    .pill-amber { border-color: rgba(245, 158, 11, 0.6); color: #fcd34d; }
    .pill-crimson { border-color: rgba(139, 30, 36, 0.9); background: rgba(139, 30, 36, 0.5); color: #fecdd3; }
    .pill-emerald { border-color: rgba(16, 185, 129, 0.6); color: #6ee7b7; }
    .hud-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
      background: rgba(26, 25, 32, 0.92);
      color: #e4e4e7;
      padding: 4px 7px;
      font-size: 10px;
      font-weight: 800;
      transition: background 0.15s, border-color 0.15s;
    }
    .hud-btn:hover { background: #27272a; }
    .hud-btn.active { border-color: #f59e0b; background: rgba(139, 30, 36, 0.72); color: #fde68a; }
    #toast-banner {
      position: absolute;
      bottom: 36px;
      right: 8px;
      z-index: 25;
      pointer-events: none;
      border: 1px solid rgba(245, 158, 11, 0.75);
      background: rgba(18, 18, 22, 0.95);
      color: #fde68a;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      display: none;
    }
    #quest-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 38px;
      width: 100%;
      flex-shrink: 0;
      padding: 0 12px;
      background: #1a1920;
      border: none;
      border-bottom: 1px solid #27272a;
      color: #e4e4e7;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
    }
    #quest-bar.ready {
      background: linear-gradient(90deg, rgba(139,30,36,0.85), rgba(120,53,15,0.75), rgba(139,30,36,0.85));
      border-bottom-color: #f59e0b;
      color: #fde68a;
    }
    #body-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; background: #121216; }
    #tab-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding: 10px 10px 16px;
    }
    #tab-content::-webkit-scrollbar { width: 4px; }
    #tab-content::-webkit-scrollbar-track { background: rgba(18, 18, 22, 0.7); }
    #tab-content::-webkit-scrollbar-thumb { background: rgba(139, 30, 36, 0.75); border-radius: 9999px; }
    #bottom-nav {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      height: 54px;
      flex-shrink: 0;
      background: #1a1920;
      border-top: 1px solid #27272a;
    }
    .nav-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border: none;
      border-top: 2px solid transparent;
      background: transparent;
      color: #a1a1aa;
      font-size: 9.5px;
      font-weight: 800;
      padding: 0 2px;
      white-space: nowrap;
    }
    .nav-btn:hover { color: #e4e4e7; }
    .nav-btn.active { border-top-color: #f59e0b; background: rgba(139, 30, 36, 0.32); color: #fcd34d; }
    .nav-kbd {
      display: none;
      background: rgba(39, 39, 42, 0.9);
      color: #a1a1aa;
      border-radius: 3px;
      padding: 0 3px;
      font-size: 7.5px;
    }
    @media (min-width: 640px) { .nav-kbd { display: inline-block; } }
    /* Reusable Panel & Card Styles */
    .card {
      background: #1a1920;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .card-crimson { border-color: rgba(139, 30, 36, 0.75); background: linear-gradient(180deg, rgba(139,30,36,0.18), #1a1920); }
    .card-amber { border-color: rgba(245, 158, 11, 0.55); background: linear-gradient(180deg, rgba(120,53,15,0.22), #1a1920); }
    .subtabs { display: grid; gap: 4px; margin-bottom: 8px; }
    .subtab-btn {
      border: 1px solid #27272a;
      background: #18181d;
      color: #a1a1aa;
      border-radius: 7px;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 800;
    }
    .subtab-btn.active { border-color: #f59e0b; background: rgba(139, 30, 36, 0.45); color: #fde68a; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      border-radius: 7px; border: 1px solid #3f3f46;
      background: #27272a; color: #f4f4f5;
      font-size: 11px; font-weight: 800; padding: 6px 10px;
      transition: filter 0.12s, transform 0.08s;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn-amber { background: #f59e0b; border-color: #fbbf24; color: #09090b; }
    .btn-emerald { background: #059669; border-color: #10b981; color: #ecfdf5; }
    .btn-crimson { background: #8B1E24; border-color: #dc2626; color: #fff1f2; }
    .btn-ghost { background: #141418; border-color: #27272a; color: #d4d4d8; }
    .btn-sm { padding: 4px 8px; font-size: 10px; }
    .badge {
      display: inline-flex; align-items: center; gap: 3px;
      border-radius: 5px; border: 1px solid #3f3f46;
      padding: 2px 6px; font-size: 10px; font-weight: 800;
    }
    .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .text-xs { font-size: 11px; }
    .text-xxs { font-size: 10px; }
    .muted { color: #a1a1aa; }
    .text-amber { color: #fcd34d; }
    .text-emerald { color: #6ee7b7; }
    .text-rose { color: #fda4af; }
    .text-sky { color: #7dd3fc; }
    .text-purple { color: #d8b4fe; }
    .r-common { border-color: #52525b !important; color: #d4d4d8; }
    .r-rare { border-color: rgba(16,185,129,0.75) !important; color: #6ee7b7; background: rgba(6,78,59,0.28); }
    .r-epic { border-color: rgba(168,85,247,0.75) !important; color: #d8b4fe; background: rgba(88,28,135,0.28); }
    .r-unique { border-color: #f59e0b !important; color: #fcd34d; background: rgba(120,53,15,0.32); }
    .r-legendary { border-color: #ef4444 !important; color: #fda4af; background: rgba(139,30,36,0.36); }
    .input-box {
      width: 100%;
      border-radius: 7px;
      border: 1px solid #3f3f46;
      background: #121216;
      padding: 6px 10px;
      outline: none;
    }
    .input-box:focus { border-color: #f59e0b; }
    .progress-track {
      width: 100%; height: 7px; background: #121216; border-radius: 9999px; overflow: hidden; border: 1px solid #27272a;
    }
    .progress-fill { height: 100%; transition: width 0.2s; }
    #overlay-host, #modal-host {
      position: absolute;
      inset: 0;
      z-index: 40;
      pointer-events: none;
    }
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(6, 6, 9, 0.82);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      pointer-events: auto;
    }
    .modal-panel {
      width: 100%;
      max-width: 390px;
      max-height: 90%;
      overflow-y: auto;
      background: #1a1920;
      border: 1px solid #8B1E24;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.84) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .pop-in { animation: popIn 0.22s ease-out both; }
  </style>
</head>
<body>
<div id="app-root">
  <div id="phone-shell">
    <div id="stage-wrap">
      <canvas id="game-canvas" class="pixelated" width="420" height="250"></canvas>
      <div id="top-hud"></div>
      <div id="toast-banner"></div>
    </div>
    <button id="quest-bar" type="button">
      <span id="quest-text">Loading contract...</span>
      <span id="quest-reward" class="mono"></span>
    </button>
    <div id="body-wrap">
      <main id="tab-content"></main>
      <nav id="bottom-nav" aria-label="Game Menus"></nav>
    </div>
    <div id="overlay-host"></div>
    <div id="modal-host"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ==================== 1. SAFE STORAGE (IFRAME / INCOGNITO RESILIENT) ====================
  var memStore = {};
  var probedStorage = false;
  var nativeLS = null;
  function getNativeLS() {
    if (probedStorage) return nativeLS;
    probedStorage = true;
    try {
      var ls = window.localStorage;
      if (!ls) return null;
      var k = '__syndicate_probe__';
      ls.setItem(k, '1');
      ls.removeItem(k);
      nativeLS = ls;
    } catch (e) {
      nativeLS = null;
    }
    return nativeLS;
  }
  var SafeStorage = {
    isPersistent: function () { return getNativeLS() !== null; },
    getItem: function (key) {
      var ls = getNativeLS();
      if (ls) {
        try {
          var v = ls.getItem(key);
          if (v !== null) { memStore[key] = v; return v; }
        } catch (e) {}
      }
      return Object.prototype.hasOwnProperty.call(memStore, key) ? memStore[key] : null;
    },
    setItem: function (key, val) {
      var str = String(val);
      memStore[key] = str;
      var ls = getNativeLS();
      if (ls) {
        try { ls.setItem(key, str); return true; } catch (e) {}
      }
      return false;
    },
    removeItem: function (key) {
      delete memStore[key];
      var ls = getNativeLS();
      if (ls) {
        try { ls.removeItem(key); } catch (e) {}
      }
    },
    clear: function () {
      memStore = {};
      var ls = getNativeLS();
      if (ls) {
        try { ls.clear(); } catch (e) {}
      }
    }
  };
  try { window.SafeStorage = SafeStorage; } catch (e) {}

  // ==================== 2. WEB AUDIO SYNTHESIZER (AUTOPLAY SAFE) ====================
  var SoundEngine = function () {
    this.ctx = null;
    this.muted = false;
    this.sfxVol = 0.75;
    this.bgmVol = 0.35;
    this.lastAtkAt = 0;
    this.bgmTimer = null;
    this.bgmStep = 0;
    this.fever = false;
    var self = this;
    function onGesture() {
      self.unlock();
      if (self.ctx && self.ctx.state === 'running') {
        window.removeEventListener('pointerdown', onGesture, true);
        window.removeEventListener('touchstart', onGesture, true);
        window.removeEventListener('keydown', onGesture, true);
      }
    }
    window.addEventListener('pointerdown', onGesture, { capture: true, passive: true });
    window.addEventListener('touchstart', onGesture, { capture: true, passive: true });
    window.addEventListener('keydown', onGesture, { capture: true, passive: true });
  };
  SoundEngine.prototype.ensureCtx = function () {
    if (this.muted) return null;
    if (!this.ctx) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      try {
        var p = this.ctx.resume();
        if (p && typeof p.catch === 'function') p.catch(function () {});
      } catch (e) {}
    }
    return this.ctx;
  };
  SoundEngine.prototype.unlock = function () { this.ensureCtx(); };
  SoundEngine.prototype.setMuted = function (m) { this.muted = !!m; if (this.muted) this.stopBgm(); };
  SoundEngine.prototype.setSfxVolume = function (v) { this.sfxVol = Math.max(0, Math.min(1, v)); };
  SoundEngine.prototype.setBgmVolume = function (v) { this.bgmVol = Math.max(0, Math.min(1, v)); };
  SoundEngine.prototype.setFever = function (f) { this.fever = !!f; };
  SoundEngine.prototype.tone = function (f1, f2, dur, type, vol, delay, ch) {
    var ctx = this.ensureCtx();
    if (!ctx || ctx.state !== 'running') return;
    var sc = vol * (ch === 'bgm' ? this.bgmVol : this.sfxVol);
    if (sc <= 0.001) return;
    try {
      var now = ctx.currentTime + (delay || 0);
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.type = type || 'triangle';
      osc.frequency.setValueAtTime(Math.max(40, f1), now);
      if (f2 !== f1) osc.frequency.exponentialRampToValueAtTime(Math.max(40, f2), now + dur);
      g.gain.setValueAtTime(sc, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.01);
    } catch (e) {}
  };
  SoundEngine.prototype.startBgm = function () {
    if (this.muted || this.bgmTimer !== null) return;
    var self = this;
    var bass = [110, 130.81, 146.83, 164.81, 146.83, 164.81, 174.61, 146.83, 174.61, 164.81, 146.83, 130.81, 164.81, 196, 155.56, 123.47];
    var lead = [440, 0, 523.25, 0, 587.33, 0, 523.25, 493.88, 440, 0, 392, 0, 329.63, 415.3, 493.88, 0];
    this.bgmStep = 0;
    this.bgmTimer = window.setInterval(function () {
      if (self.muted || self.bgmVol <= 0.01) return;
      var ctx = self.ensureCtx();
      if (!ctx || ctx.state !== 'running') return;
      var i = self.bgmStep % bass.length;
      var mult = self.fever ? 1.122 : 1;
      self.tone(bass[i] * mult, bass[i] * 0.96 * mult, 0.19, 'triangle', 0.055, 0, 'bgm');
      if (lead[i] > 0) self.tone(lead[i] * mult, lead[i] * 0.99 * mult, 0.16, 'sine', 0.036, 0.02, 'bgm');
      if (i % 4 === 2) self.tone(900, 320, 0.035, 'square', 0.01, 0, 'bgm');
      self.bgmStep++;
    }, 240);
  };
  SoundEngine.prototype.stopBgm = function () {
    if (this.bgmTimer !== null) { window.clearInterval(this.bgmTimer); this.bgmTimer = null; }
  };
  SoundEngine.prototype.playAttack = function (job, crit) {
    var now = performance.now();
    if (now - this.lastAtkAt < 70) return;
    this.lastAtkAt = now;
    if (job === 'warrior') this.tone(crit ? 220 : 170, 58, 0.09, 'sawtooth', crit ? 0.09 : 0.06);
    else if (job === 'magician') this.tone(620, 210, 0.1, 'triangle', 0.06);
    else if (job === 'bowman') this.tone(crit ? 860 : 680, 140, 0.055, 'square', 0.055);
    else this.tone(crit ? 1150 : 920, 320, 0.05, 'triangle', 0.055);
  };
  SoundEngine.prototype.playSkill = function (job) {

  }

  function formatNum(num) {

    var tier = Math.floor(Math.log10(abs) / 3);
    var scale = Math.pow(10, tier * 3);
    var val = abs / scale;
    if (val >= 999.95 && tier < 680) {

      val = abs / scale;
    }
    var fmt = val >= 100 ? val.toFixed(0) : val >= 10 ? val.toFixed(1) : val.toFixed(2);

  }

  function computeBulkUpgrade(key, currentLevel, mesos, mult) {

    var ratioArg = 1 + (safeMesos * (r - 1)) / c0;
    var levels = Math.floor(Math.log(Math.max(1, ratioArg)) / Math.log(r));
    levels = Math.max(1, Math.min(capCount, levels));
    while (levels > 0 && geoSum(levels) > safeMesos) levels--;

    save.statsTotals.totalSummons += count;
    var results = [];
    var compIds = Object.keys(COMPANIONS);
    var gachaLv = (save.transcendSkills && save.transcendSkills.gacha_aura) || 0;
    var expPer = 1 + gachaLv * 0.1;

    for (var i = 0; i < count; i++) {
      var rarity = rollRarity(save.summonLevel);
      if (banner === 'weapon') {
        var pool = WEAPONS.filter(function (w) { return w.rarity === rarity; });
        var jobPool = pool.filter(function (w) { return w.job === save.job; });
        var chosen = (jobPool.length > 0 && Math.random() < 0.45) ? jobPool[Math.floor(Math.random() * jobPool.length)] : pool[Math.floor(Math.random() * pool.length)];
        var prev = save.weapons[chosen.id] || { count: 0, level: 1, unlocked: false, stars: 0 };
        var isNew = !prev.unlocked;
        save.weapons[chosen.id] = { unlocked: true, level: prev.level, stars: prev.stars || 0, count: isNew ? prev.count : prev.count + 1 };
        results.push({ category: 'weapon', id: chosen.id, name: chosen.name, rarity: chosen.rarity, isNew: isNew, job: chosen.job, subLabel: JOBS[chosen.job].name + ' · +' + chosen.baseAtkPct + '% ATK' });
      } else {
        var matching = compIds.filter(function (cid) { return COMPANIONS[cid].rarity === rarity; });
        var chosenId = matching.length > 0 ? matching[Math.floor(Math.random() * matching.length)] : compIds[Math.floor(Math.random() * compIds.length)];
        var def = COMPANIONS[chosenId];
        var prevC = save.companions[chosenId];
        var isNewC = !prevC.unlocked;
        save.companions[chosenId] = { unlocked: true, level: prevC.level, count: isNewC ? prevC.count : prevC.count + 1 };
        if (isNewC && save.equippedCompanions.length < 2 && save.equippedCompanions.indexOf(chosenId) === -1) save.equippedCompanions.push(chosenId);
        results.push({ category: 'companion', id: def.id, name: def.name, rarity: def.rarity, isNew: isNewC, subLabel: '+' + def.baseBuffValue + '% ' + def.buffLabel });
      }
      save.summonExp = Number((save.summonExp + expPer).toFixed(2));
      while (save.summonLevel < 10 && save.summonExp >= SUMMON_EXP_THRESHOLDS[save.summonLevel]) {
        save.summonExp = Number((save.summonExp - SUMMON_EXP_THRESHOLDS[save.summonLevel]).toFixed(2));
        save.summonLevel += 1;
      }
    }
    advanceQuestProgress(save, 'summon_pulls', count);
    return results;
  }

  function performStyleBoxPull(save, useTicket) {

    else { if (save.diamonds < 150) return null; save.diamonds -= 150; }
    var allIds = Object.keys(COSMETICS).filter(function (id) { return !COSMETICS[id].warExclusive; });
    var locked = allIds.filter(function (id) { return !save.cosmeticsUnlocked[id]; });
    var pool = (locked.length > 0 && Math.random() < 0.78) ? locked : allIds;
    var chosenId = pool[Math.floor(Math.random() * pool.length)];
    var def = COSMETICS[chosenId];
    var isNew = !save.cosmeticsUnlocked[chosenId];
    if (!isNew) save.starStones += 4;
    save.cosmeticsUnlocked[chosenId] = true;
    if (isNew && !save.equippedCosmetics[def.slot]) save.equippedCosmetics[def.slot] = chosenId;
    var bonusLabel = def.bonusType === 'atk_pct' ? '+' + def.bonusValue + '% ATK' : (def.bonusType === 'meso_pct' ? '+' + def.bonusValue + '% Cash' : '+' + def.bonusValue + '% Crit DMG');

  function applyStarForceAttempt(save, weaponId, caughtGreenZone) {
    var owned = save.weapons[weaponId], def = findWeapon(weaponId);
    if (!owned || !owned.unlocked || !def) return null;
    if (def.rarity !== 'unique' && def.rarity !== 'legendary') return null;
    var oldStars = owned.stars || 0;
    if (oldStars >= 15) return null;
    var cfg = getStarForceConfig(oldStars);
    if (save.mesos < cfg.mesoCost || save.starStones < cfg.stoneCost) return null;
    save.mesos -= cfg.mesoCost;
    save.starStones -= cfg.stoneCost;
    var finalChance = Math.min(100, cfg.successPct + (caughtGreenZone ? 5 : 0));
    var success = Math.random() * 100 < finalChance;
    var newStars = oldStars;
    if (success) newStars = oldStars + 1;
    else if (cfg.canDropOnFail) newStars = Math.max(10, oldStars - 1);
    owned.stars = newStars;
    return { success: success, oldStars: oldStars, newStars: newStars };

  function computePendingArcaneSymbols(save) {
    if (!isTranscendUnlocked(save)) return 0;
    var highestSeen = Math.max(save.highestStageCleared || 0, Math.max(0, save.stage - 1));
    var basis = Math.max(save.stage, highestSeen);
    var raw = Math.floor(safePow(Math.max(1, basis - 24), 1.35) * 0.75 + Math.floor(save.level / 4));
    return Math.max(2, Math.floor(sanitizeNum(raw, 2)));

  function getTranscendSkillCost(id, lv) {

  function canUpgradeTranscendSkill(save, id) {
    var def = TRANSCEND_SKILLS[id];

    if (lv >= def.maxLevel) return false;
    if (def.requires && def.requires.length > 0) {
      var hasParent = def.requires.some(function (rid) { return ((save.transcendSkills && save.transcendSkills[rid]) || 0) > 0; });
      if (!hasParent) return false;

    return save.arcaneSymbols >= getTranscendSkillCost(id, lv);
  }

  function upgradeTranscendSkill(save, id) {

    var lv = (save.transcendSkills && save.transcendSkills[id]) || 0;
    save.arcaneSymbols -= getTranscendSkillCost(id, lv);

    var startStage = hasSafeHouses ? Math.max(1, Math.floor(newHighest * 0.5)) : 1;
    save.stage = startStage;

  function autoMergeAndEquipBest(save) {
    var mergesDone = 0;
    var jobs = ['warrior', 'magician', 'bowman', 'thief'];
    for (var j = 0; j < jobs.length; j++) {
      var job = jobs[j];
      for (var rIdx = 0; rIdx < RARITY_ORDER.length; rIdx++) {
        var rar = RARITY_ORDER[rIdx];
        var wpn = WEAPONS.find(function (w) { return w.job === job && w.rarity === rar; });
        if (!wpn) continue;
        var owned = save.weapons[wpn.id];
        if (!owned || owned.count < 5) continue;
        var batch = Math.floor(owned.count / 5);
        owned.count -= batch * 5;
        mergesDone += batch;
        if (rIdx < RARITY_ORDER.length - 1) {
          var nextWpn = WEAPONS.find(function (w) { return w.job === job && w.rarity === RARITY_ORDER[rIdx + 1]; });
          if (nextWpn) {
            var target = save.weapons[nextWpn.id] || { unlocked: false, count: 0, level: 1, stars: 0 };
            save.weapons[nextWpn.id] = {
              unlocked: true, level: target.level, stars: target.stars || 0,
              count: target.unlocked ? target.count + batch : target.count + Math.max(0, batch - 1)
            };
          }
        } else {
          owned.level += batch;
        }
      }
      var cands = WEAPONS.filter(function (w) { return w.job === job && save.weapons[w.id] && save.weapons[w.id].unlocked; });
      if (cands.length > 0) {
        cands.sort(function (a, b) { return getWeaponAtkPct(b, save.weapons[b.id]) - getWeaponAtkPct(a, save.weapons[a.id]); });
        save.equippedWeaponByJob[job] = cands[0].id;
      }
    }
    Object.keys(save.companions).forEach(function (cid) {
      var o = save.companions[cid];
      if (o.count >= 5) {
        var b = Math.floor(o.count / 5);
        o.count -= b * 5;
        o.level += b;
        mergesDone += b;
      }
    });
    var unlComps = Object.keys(save.companions).filter(function (cid) { return save.companions[cid].unlocked; });
    unlComps.sort(function (a, b) {
      return (RARITY_META[COMPANIONS[b].rarity].mult * save.companions[b].level) - (RARITY_META[COMPANIONS[a].rarity].mult * save.companions[a].level);
    });
    save.equippedCompanions = unlComps.slice(0, 2);
    return mergesDone;
  }

  function regenDungeonKeys(save) {
    var now = Date.now(), intervalMs = 600000;

    var gained = Math.floor(elapsed / intervalMs);

    save.dungeonKeys.jewel = Math.max(save.dungeonKeys.jewel, Math.min(5, save.dungeonKeys.jewel + gained));
    save.dungeonKeys.lastRegenAt += gained * intervalMs;

  function calculateOfflineGains(save) {
    var elapsedSeconds = Math.min(86400, Math.floor((Date.now() - save.lastSavedAt) / 1000));
    if (elapsedSeconds < 20) return null;
    var stats = computeStats(save);
    var liveOps = getEffectiveLiveOpsBonuses();
    var twMult = 1 + ((save.transcendSkills && save.transcendSkills.time_warp) || 0) * 0.2;
    var killsPerMin = 12 + Math.min(18, stats.atkSpeed * 6);
    var totalKills = (elapsedSeconds / 60) * killsPerMin;

    var expPerKill = getStageExpReward(save.stage, false) * (1 + stats.expBonusPct / 100) * liveOps.expMult;
    return {

      exp: Math.max(30, Math.floor(sanitizeNum(totalKills * expPerKill * 0.65 * twMult, 30))),

    };
  }

  function computeDataChecksum(payload) {
    var json = JSON.stringify(payload);
    var h1 = 0x811c9dc5, h2 = 0x9e3779b9;
    for (var i = 0; i < json.length; i++) {
      var ch = json.charCodeAt(i);
      h1 ^= ch;
      h1 = Math.imul(h1, 0x01000193);
      h2 ^= ch + ((h1 >>> 16) & 0xff);
      h2 = Math.imul(h2, 0x85ebca6b);
    }
    return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
  }

  function computeSecuritySig(save) {
    var sf = {};

      var w = save.weapons[wid];
      if (w && (w.stars || 0) > 0) sf[wid] = w.stars;
    });
    return computeDataChecksum({
      p: (save.profile && save.profile.playerId) || '',
      m: Math.floor(save.mesos || 0),
      d: Math.floor(save.diamonds || 0),
      h: Math.floor(save.honorCoins || 0),
      c: Math.floor(save.chaosCores || 0),
      a: Math.floor(save.arcaneSymbols || 0),
      st: save.stage, lv: save.level, eq: save.equippedWeaponByJob, sf: sf, t: Boolean(save.tainted)
    });

  function verifySaveIntegrity(save, hadExisting) {
    var reasons = [];
    if (!Number.isFinite(save.mesos) || save.mesos < 0) reasons.push('CORRUPT_MESOS');
    if (!Number.isFinite(save.diamonds) || save.diamonds < 0) reasons.push('CORRUPT_DIAMONDS');
    if (!Number.isFinite(save.chaosCores) || save.chaosCores < 0) reasons.push('CORRUPT_CORES');
    if (!Number.isFinite(save.arcaneSymbols) || save.arcaneSymbols < 0) reasons.push('CORRUPT_SYMBOLS');
    Object.keys(save.weapons || {}).forEach(function (wid) {
      var w = save.weapons[wid];
      if (w && ((w.stars || 0) < 0 || (w.stars || 0) > 15)) reasons.push('INVALID_STAR_FORCE(' + wid + ')');
    });
    if (hadExisting) {
      var exp = computeSecuritySig(save);
      if (!save._sig || save._sig !== exp) reasons.push('STORAGE_CHECKSUM_MISMATCH');
    }
    if (save.tainted) reasons.push('PREVIOUSLY_TAINTED');
    return { ok: reasons.length === 0, reasons: reasons };

  function sampleClockDrift() {
    if (typeof performance === 'undefined') return { speedhackSuspected: false, safeDtCap: 0.05 };
    var nowPerf = performance.now(), nowWall = Date.now();
    var perfDelta = nowPerf - lastClockPerf, wallDelta = nowWall - lastClockWall;
    if (wallDelta >= 400) {
      lastClockPerf = nowPerf;
      lastClockWall = nowWall;
      if (perfDelta > wallDelta * 1.55 + 350 && !document.hidden) driftStrikes += 1;
      else if (perfDelta <= wallDelta * 1.25 + 150) driftStrikes = Math.max(0, driftStrikes - 1);
    }
    var ratio = wallDelta > 200 ? Math.min(1, Math.max(0.25, wallDelta / Math.max(1, perfDelta))) : 1;
    return { speedhackSuspected: driftStrikes >= 4, safeDtCap: 0.05 * ratio };

  // ==================== 5. FIGHT CLUB DUEL SIMULATOR & NETWORK MANAGER ====================
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      var t = (a += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function simulateArenaDuel(playerSnap, rival, seed, duelType, currency, stake, wagerBonusPct, houseFeeOverride) {
    var rng = mulberry32(seed);
    var avgDps = Math.max(20, (playerSnap.stats.atk * playerSnap.stats.atkSpeed + rival.stats.atk * rival.stats.atkSpeed) * 0.5);
    var avgRawHp = Math.max(120, (playerSnap.stats.maxHp + rival.stats.maxHp) * 0.5);
    var hpScale = Math.max(avgRawHp * 2.4, avgDps * 13.5) / avgRawHp;

    function initF(side, snap) {
      var hasCore = snap.equippedRelics.indexOf('el_nath_core') !== -1;
      var maxHp = Math.max(300, Math.round(sanitizeNum(snap.stats.maxHp * hpScale * (hasCore ? 1.08 : 1), 1000)));
      var compCds = {};
      snap.equippedCompanions.forEach(function (cid, i) { compCds[cid] = 0.6 + i * 0.35; });
      return { side: side, snap: snap, hp: maxHp, maxHp: maxHp, atkCd: side === 'player' ? 0.35 : 0.45, skillCds: {}, compCds: compCds, stunTimer: 0, attackCounter: 0, totalDmg: 0, crits: 0, stuns: 0, breakdown: {} };
    }
    var pState = initF('player', playerSnap), rState = initF('rival', rival);
    var timeline = [], dt = 0.05, t = 0;

    function rec(f, name, kind, dmg, isCrit, color) {
      if (!f.breakdown[name]) f.breakdown[name] = { sourceName: name, kind: kind, totalDmg: 0, hits: 0, crits: 0, color: color };
      f.breakdown[name].totalDmg += dmg;
      f.breakdown[name].hits += 1;
      if (isCrit) f.breakdown[name].crits += 1;
      f.totalDmg += dmg;
      if (isCrit) f.crits += 1;
    }
    function rollHit(f, mult, bonusCrit) {
      var hasCore = f.snap.equippedRelics.indexOf('el_nath_core') !== -1;
      var eff = Math.min(95, f.snap.stats.critRate + (bonusCrit || 0) + (hasCore ? 6 : 0));
      var isCrit = rng() * 100 < eff;
      var raw = sanitizeNum(f.snap.stats.atk * mult * (0.92 + rng() * 0.16) * (isCrit ? f.snap.stats.critDmg / 100 : 1), 10);
      return { dmg: Math.max(5, Math.floor(raw)), isCrit: isCrit };
    }
    function pushEv(atk, def, kind, skName, skColor, dmg, isCrit, didStun, didKb, aoe, skId) {
      def.hp = Math.max(0, def.hp - dmg);
      if (didStun && def.hp > 0) { def.stunTimer = Math.max(def.stunTimer, 0.7); atk.stuns += 1; }
      rec(atk, skName, kind, dmg, isCrit, skColor);
      timeline.push({ t: Number(t.toFixed(2)), attacker: atk.side, kind: kind, skillId: skId, skillName: skName, skillColor: skColor, dmg: dmg, isCrit: isCrit, didStun: didStun, didKnockback: didKb, playerHpAfter: pState.hp, rivalHpAfter: rState.hp, aoe: aoe });
    }
    function stepFighter(atk, def) {
      if (atk.hp <= 0 || def.hp <= 0) return;
      var jobDef = JOBS[atk.snap.job];
      jobDef.skills.forEach(function (sk) { if ((atk.skillCds[sk.id] || 0) > 0) atk.skillCds[sk.id] = Math.max(0, atk.skillCds[sk.id] - dt); });
      atk.snap.equippedCompanions.forEach(function (cid) {
        var cDef = COMPANIONS[cid];

  MapleEngine.prototype.start = function () {
    if (this.rafId !== null) return;
    resetClockMonitor();
    this.lastTime = performance.now();
    this.lastRenderAt = this.lastTime;
    var self = this;
    function loop(now) {
      var minFrameMs = self.lowPowerMode ? 33 : 0;
      if (minFrameMs > 0 && now - self.lastRenderAt < minFrameMs) {
        self.rafId = requestAnimationFrame(loop);
        return;
      }
      self.lastRenderAt = now;
      var rawDt = (now - self.lastTime) / 1000;
      self.lastTime = now;
      var drift = sampleClockDrift();
      if (drift.speedhackSuspected && !self.speedhackNotified) {
        self.speedhackNotified = true;
        if (self.cb.onSpeedhackDetected) self.cb.onSpeedhackDetected('TIME_SCALE_SPEEDHACK');
      }
      var dt = Math.min(Math.max(rawDt, 0.001), Math.min(0.1, Math.max(0.015, drift.safeDtCap)));
      self.update(dt);
      self.render();
      self.rafId = requestAnimationFrame(loop);
    }
    this.rafId = requestAnimationFrame(loop);
  };

  MapleEngine.prototype.setGameMode = function (m) { this.gameMode = m; };
  MapleEngine.prototype.setLowPowerMode = function (v) { this.lowPowerMode = !!v; };
  MapleEngine.prototype.setArenaSpeed = function (v) { this.arenaSpeedMult = v; };
  MapleEngine.prototype.syncSave = function (next) {
    var prev = this.heroMaxHp;
    this.save = next;

  MapleEngine.prototype.drawMonsters = function (ctx) {
    var ordered = this.monsters.slice().sort(function (a, b) { return a.isZakumBody ? -1 : (b.isZakumBody ? 1 : 0); });
    for (var i = 0; i < ordered.length; i++) {
      var m = ordered[i], frame = Math.floor(m.hopPhase) % 2;
      if (m.isZakumBody) {
        var zb = sprites.getZakumBodySprite(frame), zw = Math.round(zb.width * m.scale), zh = Math.round(zb.height * m.scale * m.squash);
        ctx.drawImage(zb, Math.round(m.x - zw / 2), Math.round(m.y - zh), zw, zh);
        if (m.flashTimer > 0) { ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(Math.round(m.x - zw / 2), Math.round(m.y - zh), zw, zh); }
        continue;
      }
      if (m.isZakumArm) {
        var za = sprites.getZakumArmSprite(m.armSide || 'left', frame), aw = Math.round(za.width * m.scale), ah = Math.round(za.height * m.scale * m.squash);
        var adx = Math.round(m.x - aw / 2), ady = Math.round(m.y - ah + Math.sin(m.hopPhase) * 3);
        ctx.drawImage(za, adx, ady, aw, ah);
        ctx.fillStyle = '#0f172a'; ctx.fillRect(Math.round(m.x - 11), ady - 5, 22, 4);
        ctx.fillStyle = '#f97316'; ctx.fillRect(Math.round(m.x - 10), ady - 4, Math.max(1, Math.round(20 * (m.hp / m.maxHp))), 2);
        continue;
      }
      var spr = sprites.getMonsterSprite(m.spriteId, frame), hop = Math.abs(Math.sin(m.hopPhase)) * (m.isBoss ? 3 : 4);
      var w = Math.round(spr.width * m.scale), h = Math.round(spr.height * m.scale * m.squash), dx = Math.round(m.x - w / 2), dy = Math.round(m.y - h - hop);
      if (m.windupTimer > 0) { ctx.fillStyle = '#ef4444'; ctx.globalAlpha = 0.4; ctx.fillRect(dx - 2, dy - 2, w + 4, h + 4); ctx.globalAlpha = 1; }
      ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(Math.round(m.x - w * 0.38), GROUND_Y - 1, Math.round(w * 0.76), 2);
      ctx.save(); ctx.translate(dx + w, dy); ctx.scale(-1, 1); ctx.drawImage(spr, 0, 0, w, h); ctx.restore();
      if (m.flashTimer > 0) { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(dx, dy, w, h); }
      if (!m.isBoss && m.hp < m.maxHp) {
        ctx.fillStyle = '#0f172a'; ctx.fillRect(Math.round(m.x - 12), dy - 6, 24, 4);

  };

  MapleEngine.prototype.drawFx = function (ctx) {
    for (var i = 0; i < this.projectiles.length; i++) {
      var pr = this.projectiles[i], px = Math.round(pr.x), py = Math.round(pr.y);
      if (pr.kind === 'arrow') { ctx.fillStyle = '#f59e0b'; ctx.fillRect(px - 6, py, 7, 2); ctx.fillStyle = '#fef08a'; ctx.fillRect(px + 1, py, 4, 2); }
      else if (pr.kind === 'rain_arrow') { ctx.fillStyle = '#facc15'; ctx.fillRect(px, py - 5, 2, 7); }
      else if (pr.kind === 'star') { ctx.fillStyle = '#cbd5e1'; ctx.fillRect(px - 4, py - 1, 8, 2); ctx.fillStyle = '#8b1e24'; ctx.fillRect(px - 5, py - 1, 3, 2); }
      else if (pr.kind === 'meteor') { ctx.fillStyle = '#8b1e24'; ctx.fillRect(px - 4, py - 4, 8, 8); ctx.fillStyle = '#f59e0b'; ctx.fillRect(px - 3, py - 5, 6, 4); }
      else { ctx.fillStyle = pr.color; ctx.fillRect(px - 2, py - 2, 5, 5); }
    }
    for (var s = 0; s < this.slashes.length; s++) {
      var sl = this.slashes[s], alpha = Math.max(0, sl.life / sl.maxLife);
      ctx.globalAlpha = alpha;
      if (sl.kind === 'lightning' && sl.points && sl.points.length >= 2) {
        ctx.strokeStyle = sl.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sl.points[0].x, sl.points[0].y);
        for (var k = 1; k < sl.points.length; k++) ctx.lineTo(sl.points[k].x, sl.points[k].y);
        ctx.stroke();
      } else if (sl.kind === 'hammer') {
        ctx.fillStyle = '#92400e'; ctx.fillRect(sl.x - 16, sl.y - 24 * alpha, 32, 18); ctx.fillStyle = '#fef08a'; ctx.fillRect(sl.x - 36, GROUND_Y - 4, 72, 4);
      } else if (sl.kind === 'ring') {
        ctx.strokeStyle = sl.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sl.x, sl.y, sl.radius * (1.2 - alpha * 0.4), 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.strokeStyle = sl.color; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(sl.x - 8, sl.y, sl.radius, -0.9, 0.9); ctx.stroke();

    for (var p = 0; p < this.particles.length; p++) {
      var pt = this.particles[p]; ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife); ctx.fillStyle = pt.color; ctx.fillRect(Math.round(pt.x), Math.round(pt.y), pt.size, pt.size);

    ctx.globalAlpha = 1; ctx.textAlign = 'center';
    for (var t = 0; t < this.texts.length; t++) {
      var tx = this.texts[t]; ctx.globalAlpha = Math.min(1, tx.life / Math.max(0.01, tx.maxLife * 0.35));
      var sc = tx.isDmg ? (tx.age < 0.13 ? (tx.isCrit ? 1.45 : 1.15) : (tx.isCrit ? 1.2 : 1.0)) : 1;

    if (ui.lockTimer) window.clearInterval(ui.lockTimer);
    ui.lockTimer = window.setInterval(function () {
      if (ui.activeModal !== 'starforce' || ui.lockPaused) return;
      ui.lockPos += ui.lockDir * 3.4;
      if (ui.lockPos >= 96) { ui.lockPos = 96; ui.lockDir = -1; }
      if (ui.lockPos <= 2) { ui.lockPos = 2; ui.lockDir = 1; }
      var c = document.getElementById('sf-cursor');
      if (c) c.style.left = ui.lockPos + '%';
    }, 28);
  }

  function renderAll() {
    renderHud();
    renderQuest();
    renderNav();
    renderActiveTab();
    renderOverlaysAndModals();
  }

  // ==================== EVENT DELEGATION ====================
  function handleAction(act, el) {
    sfx.unlock();
    if (act === 'start-game') {
      var ignEl = document.getElementById('title-ign');
      if (ignEl) save.profile.ign = ignEl.value.trim().slice(0, 14) || 'Capo';
      ui.gameMode = 'PLAYING';
      engine.setGameMode('PLAYING');
      sfx.startBgm();
      net.syncSave(save, 'manual');
      saveNow();
      renderAll();
    } else if (act === 'toggle-pause') {
      ui.gameMode = ui.gameMode === 'PAUSED' ? 'PLAYING' : 'PAUSED';
      engine.setGameMode(ui.gameMode);
      renderOverlaysAndModals();
    } else if (act === 'resume-game') {
      ui.gameMode = 'PLAYING';
      engine.setGameMode('PLAYING');
      renderOverlaysAndModals();
    } else if (act === 'open-settings') {
      ui.resetArmed = false;
      ui.activeModal = 'settings';
      renderOverlaysAndModals();
    } else if (act === 'open-zakum') {
      ui.activeModal = 'zakum';
      renderOverlaysAndModals();
    } else if (act === 'open-profile') {
      ui.activeModal = 'profile';
      renderOverlaysAndModals();
    } else if (act === 'close-modal') {
      ui.activeModal = null;
      ui.resetArmed = false;
      if (ui.lockTimer) { window.clearInterval(ui.lockTimer); ui.lockTimer = null; }
      renderOverlaysAndModals();
    } else if (act === 'claim-offline' && offlinePending) {
      sfx.playClaim();
      save.mesos += offlinePending.mesos;
      save.summonTickets += offlinePending.tickets;
      applyExpGain(save, offlinePending.exp);
      offlinePending = null;
      ui.activeModal = null;
      saveNow();
      renderAll();
    } else if (act === 'challenge-boss') {
      engine.triggerBossChallenge();
    } else if (act === 'toggle-autoboss') {
      save.autoBoss = !save.autoBoss;
      saveNow(); renderHud();
    } else if (act === 'toggle-autoskill') {
      save.autoSkills = !save.autoSkills;
      saveNow(); renderActiveTab();
    } else if (act === 'toggle-arena-speed') {
      ui.arenaSpeed = ui.arenaSpeed === 1 ? 2 : 1;
      engine.setArenaSpeed(ui.arenaSpeed);
      renderHud();
    } else if (act === 'promote-rank') {
      var nr = MAPLE_RANKS[save.mapleRank + 1];
      if (nr && save.rankPoints >= nr.cost) {
        save.rankPoints -= nr.cost;
        save.mapleRank += 1;
        sfx.playLevelUp();
        saveNow();
        showToast('Promoted to ' + nr.name + '!');
        renderAll();
      }
    } else if (act === 'do-transcend') {
      var tr = performTranscendence(save);
      if (tr) {
        sfx.playLevelUp();
        engine.resetForTranscendence(save);
        saveNow();
        showToast('Went to the Mattresses! +' + tr.gainedSymbols + ' Omertà Seals!');
        renderAll();
      }
    } else if (act === 'merge-all') {
      var cnt = autoMergeAndEquipBest(save);
      sfx.playClaim();
      saveNow();
      showToast(cnt > 0 ? 'Consolidated ' + cnt + 'x & Equipped Best!' : 'Equipped Best Weapons & Crew!');
      renderAll();
    } else if (act === 'claim-keys') {
      var today = new Date().toISOString().slice(0, 10);
      if (save.dungeonKeys.lastFreeClaimAt !== today) {
        save.dungeonKeys.meso = Math.min(5, save.dungeonKeys.meso + 1);
        save.dungeonKeys.jewel = Math.min(5, save.dungeonKeys.jewel + 1);
        save.dungeonKeys.lastFreeClaimAt = today;
        sfx.playClaim(); saveNow(); renderActiveTab();
      }
    } else if (act === 'refresh-arena') {
      net.syncSave(save, 'manual');
      ui.arenaOpponents = net.fetchArenaOpponents(computeStats(save).combatPower, save.profile.playerId);
      renderActiveTab();
    } else if (act === 'confirm-escrow' && ui.escrowOpponent) {
      var opp = ui.escrowOpponent, cur = ui.arenaCurrency, stk = ui.arenaStake;
      var bal = cur === 'diamonds' ? save.diamonds : cur === 'chaosCores' ? save.chaosCores : save.honorCoins;
      if (bal < stk) { showToast('Not enough ' + ARENA_CURRENCY_META[cur].short + '!'); return; }
      if (cur === 'diamonds') save.diamonds -= stk;
      else if (cur === 'chaosCores') save.chaosCores -= stk;
      else save.honorCoins -= stk;
      var snap = buildCombatSnapshot(save);
      var match = simulateArenaDuel(snap, opp, Math.floor(Math.random() * 1e9), 'SNAPSHOT', cur, stk, computeStats(save).wagerBonusPct);
      ui.activeModal = null; ui.escrowOpponent = null;
      saveNow();
      engine.triggerArenaPvp(match);
      renderAll();
    } else if (act === 'attempt-sf' && ui.starforceWeaponId) {
      var caught = ui.lockPos >= 38 && ui.lockPos <= 62;
      sfx.playStarDrum();
      var res = applyStarForceAttempt(save, ui.starforceWeaponId, caught);
      if (res) {
        sfx.playStarRes(res.success);
        saveNow();
        showToast(res.success ? 'Heat Tuning Success! ' + res.newStars + '★' : 'Tuning Failed! (' + res.newStars + '★)');
        renderAll();
      }
    } else if (act === 'toggle-mute') {
      save.muted = !save.muted; sfx.setMuted(save.muted);
      if (!save.muted && ui.gameMode === 'PLAYING') sfx.startBgm();
      saveNow(); renderOverlaysAndModals();
    } else if (act === 'toggle-lowpower') {
      save.lowPowerMode = !save.lowPowerMode; engine.setLowPowerMode(save.lowPowerMode);
      saveNow(); renderOverlaysAndModals();
    } else if (act === 'toggle-dps') {
      save.showDpsMeter = !save.showDpsMeter; saveNow(); renderAll();
    } else if (act === 'redeem-promo') {
      var prIn = document.getElementById('promo-in');
      var r = net.redeemPromo(save, prIn ? prIn.value : '', liveOps);
      showToast(r.message);
      if (r.ok) { sfx.playClaim(); saveNow(); renderAll(); }
    } else if (act === 'reset-save') {
      if (!ui.resetArmed) { ui.resetArmed = true; renderOverlaysAndModals(); return; }
      SafeStorage.clear();
      window.location.reload();
    } else if (act === 'save-profile') {
      var pI = document.getElementById('prof-ign'), pT = document.getElementById('prof-tag');
      if (pI) save.profile.ign = pI.value.trim().slice(0, 14) || 'Capo';
      if (pT) save.profile.clanTag = pT.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4) || 'SYND';
      net.syncSave(save, 'manual');
      ui.activeModal = null; saveNow(); showToast('Dossier synced!'); renderAll();
    } else if (act === 'search-clans') {
      var qEl = document.getElementById('clan-search-in');
      ui.familyQuery = qEl ? qEl.value : '';
      renderActiveTab();
    } else if (act === 'create-clan') {
      var nEl = document.getElementById('new-clan-name'), tEl = document.getElementById('new-clan-tag');
      var cr = net.createClan(save, { name: nEl ? nEl.value : '', tag: tEl ? tEl.value : '', crest: ui.createClanCrest, minCp: 0 });
      if (!cr.ok) { showToast(cr.error); return; }
      currentClan = cr.clan; activeClanShrineLevel = currentClan.shrine.level;
      saveNow(); showToast('Founded [' + currentClan.tag + '] ' + currentClan.name + '!'); renderAll();
    } else if (act === 'leave-clan') {
      net.leaveClan(save); currentClan = null; currentWar = null; activeClanShrineLevel = 0;
      saveNow(); renderAll();
    } else if (act === 'send-chat' && currentClan) {
      var cEl = document.getElementById('clan-chat-in');
      if (cEl && cEl.value.trim()) {
        var myM = currentClan.members.find(function (m) { return m.playerId === save.profile.playerId; });
        net.pushChat(currentClan.clanId, save.profile.ign || 'Capo', myM ? myM.rank : 'member', cEl.value);
        renderActiveTab();
      }
    } else if (act === 'start-war' && currentClan) {
      var wr = net.startClanWar(save, currentClan);
      if (!wr.ok) { showToast(wr.error); return; }
      currentWar = wr.war; renderActiveTab();
    } else if (act === 'war-skirmish' && currentClan) {
      currentWar = net.advanceSkirmish(currentClan.clanId); renderActiveTab();
    } else if (act === 'war-end' && currentClan) {
      currentWar = net.resolveWarChest(save, currentClan); renderActiveTab();
    } else if (act === 'claim-war-chest' && currentClan) {
      var ch = net.claimWarChest(save, currentClan.clanId);
      if (ch) { ui.turfChest = ch; ui.activeModal = 'turfChest'; currentWar = null; sfx.playClaim(); saveNow(); renderAll(); }
    }
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) return;
    if (t.id === 'quest-bar') {
      if (claimCurrentQuest(save)) { sfx.playClaim(); saveNow(); showToast('Contract Paid!'); renderAll(); }
      return;
    }
    var act = t.getAttribute('data-act');
    if (act) { handleAction(act, t); return; }
    var tab = t.getAttribute('data-tab');
    if (tab) {
      ui.activeTab = tab; sfx.playClick();
      if (tab === 'arena') ui.arenaOpponents = net.fetchArenaOpponents(computeStats(save).combatPower, save.profile.playerId);
      renderNav(); renderActiveTab(); return;
    }
    var csub = t.getAttribute('data-charsub');
    if (csub) { ui.charSub = csub; renderActiveTab(); return; }
    var mult = t.getAttribute('data-mult');
    if (mult) { ui.upgradeMult = mult === 'MAX' ? 'MAX' : Number(mult); renderActiveTab(); return; }
    var upg = t.getAttribute('data-upg');
    if (upg) {
      var bulk = computeBulkUpgrade(upg, save.upgrades[upg] || 0, save.mesos, ui.upgradeMult);
      if (bulk.levels > 0 && save.mesos >= bulk.totalCost) {
        save.mesos -= bulk.totalCost; save.upgrades[upg] += bulk.levels;
        save.statsTotals.totalUpgrades += bulk.levels;
        if (upg === 'atk') advanceQuestProgress(save, 'upgrade_atk', bulk.levels);
        if (upg === 'maxHp') advanceQuestProgress(save, 'upgrade_hp', bulk.levels);
        sfx.playClick(); saveNow(); renderAll();
      }
      return;
    }
    var job = t.getAttribute('data-job');
    if (job && JOBS[job]) { save.job = job; saveNow(); renderAll(); return; }
    var cslot = t.getAttribute('data-cslot');
    if (cslot) { ui.cosmeticSlot = cslot; renderActiveTab(); return; }
    var spull = t.getAttribute('data-stylepull');
    if (spull) {
      var sr = performStyleBoxPull(save, spull === 'ticket');
      if (sr) {
        sfx.playGacha(sr.result.rarity);
        ui.gachaResults = [sr.result]; ui.activeModal = 'gacha';
        saveNow(); renderAll();
      }
      return;
    }
    var eqcos = t.getAttribute('data-eqcos');
    if (eqcos && save.cosmeticsUnlocked[eqcos]) {
      var cd = COSMETICS[eqcos];
      save.equippedCosmetics[cd.slot] = save.equippedCosmetics[cd.slot] === eqcos ? null : eqcos;
      saveNow(); renderActiveTab(); return;
    }
    var eqrel = t.getAttribute('data-eqrel');
    if (eqrel && save.relics[eqrel] && save.relics[eqrel].unlocked) {
      var rIdx = save.equippedRelics.indexOf(eqrel);
      if (rIdx !== -1) save.equippedRelics.splice(rIdx, 1);
      else if (save.equippedRelics.length < 2) save.equippedRelics.push(eqrel);
      else { showToast('Max 2 Relics equipped! Unequip one first.'); return; }
      saveNow(); renderActiveTab(); return;
    }
    var uprel = t.getAttribute('data-uprel');
    if (uprel && save.relics[uprel] && save.relics[uprel].unlocked) {
      var rDef = RELICS[uprel], rOwn = save.relics[uprel], sc = rOwn.level * 5, fc = rDef.isMythic ? rOwn.level : 0;
      if (save.starStones >= sc && save.chaosCores >= fc) {
        save.starStones -= sc; save.chaosCores -= fc; rOwn.level += 1;
        sfx.playLevelUp(); saveNow(); renderAll();
      }
      return;
    }
    var uptr = t.getAttribute('data-uptrans');
    if (uptr && upgradeTranscendSkill(save, uptr)) { sfx.playLevelUp(); saveNow(); renderAll(); return; }
    var cast = t.getAttribute('data-cast');
    if (cast) { engine.castSkillManual(cast); return; }
    var upsk = t.getAttribute('data-upskill');
    if (upsk) {
      var skDef = JOBS[save.job].skills.find(function (s) { return s.id === upsk; }), lv = save.skillLevels[upsk] || 0;
      var cost = lv === 0 ? skDef.unlockCost : Math.floor(250 * Math.pow(1.45, lv));
      if (save.mesos >= cost) { save.mesos -= cost; save.skillLevels[upsk] = lv + 1; sfx.playLevelUp(); saveNow(); renderAll(); }
      return;
    }
    var eqc = t.getAttribute('data-eqcomp');
    if (eqc && save.companions[eqc] && save.companions[eqc].unlocked) {
      var cIdx = save.equippedCompanions.indexOf(eqc);
      if (cIdx !== -1) save.equippedCompanions.splice(cIdx, 1);
      else if (save.equippedCompanions.length < 2) save.equippedCompanions.push(eqc);
      else { showToast('Max 2 Crew members deployed!'); return; }
      saveNow(); renderActiveTab(); return;
    }
    var upc = t.getAttribute('data-upcomp');
    if (upc && save.companions[upc] && save.companions[upc].unlocked) {
      var cc = save.companions[upc].level * 300;
      if (save.mesos >= cc) { save.mesos -= cc; save.companions[upc].level += 1; sfx.playLevelUp(); saveNow(); renderAll(); }
      return;
    }
    var gban = t.getAttribute('data-gban');
    if (gban) { ui.gachaBanner = gban; renderActiveTab(); return; }
    var pull = t.getAttribute('data-pull');
    if (pull) {
      var cnt = Number(pull), useTix = save.summonTickets >= cnt;
      var res = performSummon(save, ui.gachaBanner, cnt, useTix);
      if (res) {
        sfx.playGacha(res[0] ? res[0].rarity : 'common');
        ui.gachaResults = res; ui.activeModal = 'gacha';
        saveNow(); renderAll();
      }
      return;
    }
    var eqw = t.getAttribute('data-eqwpn');
    if (eqw && save.weapons[eqw] && save.weapons[eqw].unlocked) { save.equippedWeaponByJob[save.job] = eqw; saveNow(); renderAll(); return; }
    var osf = t.getAttribute('data-opensf');
    if (osf) { ui.starforceWeaponId = osf; ui.activeModal = 'starforce'; renderOverlaysAndModals(); startStarforceCursor(); return; }
    var dung = t.getAttribute('data-dungeon');
    if (dung) {
      if (dung === 'DUNGEON_MESO' && save.dungeonKeys.meso >= 1) { save.dungeonKeys.meso -= 1; saveNow(); engine.triggerDungeon('DUNGEON_MESO'); renderAll(); }
      else if (dung === 'DUNGEON_JEWEL' && save.dungeonKeys.jewel >= 1) { save.dungeonKeys.jewel -= 1; saveNow(); engine.triggerDungeon('DUNGEON_JEWEL'); renderAll(); }
      return;
    }
    var zak = t.getAttribute('data-zakum');
    if (zak) {
      if (zak === 'ticket') { if (save.expeditionTickets < 1) return; save.expeditionTickets -= 1; }
      else { if (Date.now() < save.lastExpeditionAt + EXPEDITION_COOLDOWN_MS) return; save.lastExpeditionAt = Date.now(); }
      ui.activeModal = null; saveNow(); engine.triggerZakumExpedition(); renderAll(); return;
    }
    var acur = t.getAttribute('data-acur');
    if (acur) { ui.arenaCurrency = acur; renderActiveTab(); return; }
    var astk = t.getAttribute('data-astake');
    if (astk) { ui.arenaStake = Number(astk); renderActiveTab(); return; }
    var fidx = t.getAttribute('data-fightidx');
    if (fidx !== null) { ui.escrowOpponent = ui.arenaOpponents[Number(fidx)]; ui.activeModal = 'escrow'; renderOverlaysAndModals(); return; }
    var fview = t.getAttribute('data-fview');
    if (fview) { ui.familyView = fview; renderActiveTab(); return; }
    var cic = t.getAttribute('data-crestic');
    if (cic) { ui.createClanCrest.iconId = cic; renderActiveTab(); return; }
    var jclan = t.getAttribute('data-joinclan');
    if (jclan) {
      var jr = net.joinClan(save, jclan);
      if (!jr.ok) { showToast(jr.error); return; }
      currentClan = jr.clan; activeClanShrineLevel = currentClan.shrine.level;
      saveNow(); renderAll(); return;
    }
    var don = t.getAttribute('data-donate');
    if (don && currentClan) {
      var dr = net.donateShrine(save, currentClan.clanId, don);
      if (!dr.ok) { showToast(dr.error); return; }
      currentClan = dr.clan; activeClanShrineLevel = currentClan.shrine.level;
      sfx.playClaim(); saveNow(); renderAll(); return;
    }
    var rnk = t.getAttribute('data-rank');
    if (rnk && currentClan) {
      var parts = rnk.split(':');
      currentClan = net.setMemberRank(currentClan.clanId, parts[0], parts[1]);
      renderActiveTab(); return;
    }
    var defL = t.getAttribute('data-defend');
    if (defL && currentClan) { currentWar = net.assignDefense(save, currentClan.clanId, defL); renderActiveTab(); return; }
    var raidL = t.getAttribute('data-raidlane');
    if (raidL && currentClan && currentWar) {
      var ln = currentWar.lanes[raidL], eDef = ln.enemyDefenders.find(function (d) { return !d.defeated; });
      var snap = buildCombatSnapshot(save), st = computeStats(save);
      if (eDef) {
        var dm = simulateArenaDuel(snap, Object.assign({}, eDef.snapshot, { onlineStatus: 'snapshot', preferredCurrency: 'diamonds' }), Math.floor(Math.random() * 1e9), 'CLAN_WAR', 'diamonds', 0, 0);
        engine.triggerClanSiege({ clanId: currentClan.clanId, rivalClanTag: currentWar.rivalClan.tag, laneId: raidL, laneName: ln.name, targetType: 'defender', enemyDefender: eDef, statueHp: ln.enemyStatueHp, statueMaxHp: ln.enemyStatueMaxHp, bossDmgBonusPct: st.bossDmgBonusPct, duelMatch: dm });
      } else {
        engine.triggerClanSiege({ clanId: currentClan.clanId, rivalClanTag: currentWar.rivalClan.tag, laneId: raidL, laneName: ln.name, targetType: 'statue', statueHp: ln.enemyStatueHp, statueMaxHp: ln.enemyStatueMaxHp, bossDmgBonusPct: st.bossDmgBonusPct });
      }
      return;
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'sfx-slider') { save.sfxVolume = Number(e.target.value) / 100; sfx.setSfxVolume(save.sfxVolume); saveNow(); }
    if (e.target.id === 'bgm-slider') { save.bgmVolume = Number(e.target.value) / 100; sfx.setBgmVolume(save.bgmVolume); saveNow(); }
  });

  window.addEventListener('keydown', function (e) {
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    var k = e.key.toLowerCase();
    if (k === 'm') { save.muted = !save.muted; sfx.setMuted(save.muted); saveNow(); renderOverlaysAndModals(); return; }
    if (k === ' ') {
      if (ui.gameMode === 'PLAYING' || ui.gameMode === 'PAUSED') {
        e.preventDefault();
        ui.gameMode = ui.gameMode === 'PAUSED' ? 'PLAYING' : 'PAUSED';
        engine.setGameMode(ui.gameMode); renderOverlaysAndModals();
      }
      return;
    }
    if (ui.gameMode !== 'PLAYING') return;
    var tabMap = { q: 'character', w: 'crew', e: 'summon', r: 'dungeon', t: 'arena', y: 'clan' };
    if (tabMap[k]) {
      ui.activeTab = tabMap[k];
      if (tabMap[k] === 'arena') ui.arenaOpponents = net.fetchArenaOpponents(computeStats(save).combatPower, save.profile.playerId);
      renderNav(); renderActiveTab(); return;
    }
    if (k === '1' || k === '2' || k === '3' || k === '4') {
      var sk = JOBS[save.job].skills[Number(k) - 1];
      if (sk) engine.castSkillManual(sk.id);
    }
  });

  window.setInterval(function () {
    regenDungeonKeys(save);
    saveNow();
  }, 8000);
  window.setInterval(function () {
    if (ui.gameMode === 'PLAYING') net.syncSave(save, 'interval');
  }, 60000);
  window.addEventListener('beforeunload', saveNow);

  renderAll();
  engine.start();
})();
</script>
</body>
</html>
